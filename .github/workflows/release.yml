name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Publication Windows et release GitHub
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Vérifier la version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) { throw "Le tag ${{ github.ref_name }} ne correspond pas à la version $version de Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Tests et publication self-contained (win-x64)
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64

      - name: Créer la release
        uses: softprops/action-gh-release@v2
        with:
          name: Musilib Manager ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Téléchargement

            - **MusilibManager-${{ env.VERSION }}-win-x64.zip** : exécutable + `appsettings.json` (recommandé).
            - **MusilibManager.exe** : exécutable seul, autonome (runtime .NET 10 inclus, aucune installation requise).

            Windows 10 (1809+) ou 11, x64. Pour essayer sans compte : `MusilibManager.exe --demo`.
            Configuration de YouTube et Spotify : voir le [README](https://github.com/${{ github.repository }}#configuration-de-lapi-youtube-google-cloud).

            > L'exécutable n'est pas signé : Windows SmartScreen peut afficher un avertissement au premier lancement (« Informations complémentaires » → « Exécuter quand même »).
          files: |
            artifacts/MusilibManager-${{ env.VERSION }}-win-x64.zip
            artifacts/publish/win-x64/MusilibManager.exe
          fail_on_unmatched_files: true
